<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CWTS Marketing Dashboard — May 2026</title>
<style>
  :root{
    --purple:#6f275f; --navy:#0f1751; --teal:#0d5d6d; --grey:#777777;
    --green:#1e7a46; --amber:#b8860b; --red:#a32020; --nodata:#9b9b9b;
    --bg:#f4f5f8; --card:#ffffff; --line:#e3e5ec;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--navy);line-height:1.5;padding:24px}
  .wrap{max-width:1180px;margin:0 auto}
  header{background:linear-gradient(90deg,var(--navy),var(--purple),var(--teal));color:#fff;border-radius:10px;padding:26px 30px;margin-bottom:22px}
  header h1{font-size:24px;font-weight:bold;letter-spacing:.3px}
  header .sub{font-size:14px;opacity:.92;margin-top:4px}
  .badge{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:5px 14px;border-radius:20px;font-size:13px;font-weight:bold;margin-top:12px}
  .gen{font-size:12px;opacity:.8;margin-top:8px}
  h2{font-size:17px;color:var(--purple);margin:26px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--line)}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.kpis{grid-template-columns:1fr}}
  .card{background:var(--card);border-radius:9px;padding:16px 16px 14px;border:1px solid var(--line);border-top:4px solid var(--grey)}
  .card.green{border-top-color:var(--green)}
  .card.amber{border-top-color:var(--amber)}
  .card.red{border-top-color:var(--red)}
  .card.nodata{border-top-color:var(--nodata)}
  .card .label{font-size:12px;color:var(--grey);text-transform:uppercase;letter-spacing:.5px;font-weight:bold}
  .card .val{font-size:25px;font-weight:bold;margin:6px 0 2px}
  .card .target{font-size:12px;color:var(--grey)}
  .status{display:inline-block;font-size:11px;font-weight:bold;padding:2px 9px;border-radius:12px;margin-top:9px;color:#fff}
  .s-green{background:var(--green)} .s-amber{background:var(--amber)} .s-red{background:var(--red)} .s-nodata{background:var(--nodata)}
  .pace{font-size:11px;color:var(--grey);margin-top:7px}
  .arrow{font-size:12px;font-weight:bold;margin-left:6px}
  .up{color:var(--green)} .down{color:var(--red)}
  table{width:100%;border-collapse:collapse;background:var(--card);border-radius:9px;overflow:hidden;border:1px solid var(--line);font-size:13px}
  th{background:var(--navy);color:#fff;text-align:left;padding:9px 11px;font-size:12px}
  td{padding:9px 11px;border-top:1px solid var(--line)}
  tr:nth-child(even) td{background:#fafbfc}
  .tag{display:inline-block;font-size:11px;font-weight:bold;padding:2px 8px;border-radius:10px;color:#fff}
  .t-work{background:var(--green)} .t-steady{background:var(--amber)} .t-under{background:var(--red)} .t-nodata{background:var(--nodata)}
  .plat{grid-template-columns:repeat(5,1fr)}
  @media(max-width:900px){.plat{grid-template-columns:repeat(2,1fr)}}
  .plat .card{border-top-color:var(--teal)}
  .plat .pm{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-top:1px dashed var(--line)}
  .plat .pm:first-of-type{border-top:none}
  .plat .pm b{color:var(--navy)}
  .analysis{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:20px 22px}
  .analysis p{margin-bottom:11px;font-size:14px}
  .analysis ol{margin:8px 0 0 20px}
  .analysis li{margin-bottom:9px;font-size:14px}
  .flag{background:#fbeaea;border-left:4px solid var(--red);padding:11px 14px;border-radius:5px;margin:12px 0;font-size:13px}
  .note{font-size:12px;color:var(--grey);font-style:italic;margin-top:8px}
  .footer{font-size:11px;color:var(--grey);text-align:center;margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
<script>
/* ============================================================
   MASTER DATA OBJECT — edit here each month
   All values ex GST unless noted. May 2026 reporting period.
   ============================================================ */
const DATA = {
  period: "May 2026",
  generated: "1 June 2026",
  fyTargetsMonthlyPace: { wix:11667, vetr:1250, course:6667 }, // annual/12

  kpis: {
    wixShop:   { actual:572,    target:11667, prior:null,  label:"Wix Shop Sales",      unit:"$", note:"6 orders (1 was $0 coupon). Pre-EOFY holding month." },
    vetr:      { actual:171.50, target:1250,  prior:null,  label:"Partnerships / Vetr", unit:"$", note:"1 RCTI: Third Party Management Pack. Sold value; cash basis may differ." },
    courses:   { actual:202.68, target:6667,  prior:null,  label:"Course Enrolments",   unit:"$", note:"3 aXcelerate enrolments (low-ticket). Excludes any non-invoiced." },
    consulting:{ actual:null,   target:null,  prior:null,  label:"Consulting",          unit:"$", note:"At capacity. Xero Sales line not split by stream — see analysis." },

    linkedinSpend:{ actual:260.39, target:null, prior:314.97, label:"LinkedIn Ad Spend", unit:"$", note:"Sponsored 'Website Visits' ad set." },
    googleSpend:  { actual:299.48, target:280,  prior:null,   label:"Google Ads Spend",  unit:"$", note:"Near monthly cap. 88% on mobile, via PMax." },
    marketingHrs: { actual:null,   target:20,   prior:null,   label:"Marketing Hours",   unit:"h", note:"From Teamwork — confirm marketing-tagged total before finalising." },
    totalRev:     { actual:92811, target:87500, prior:null,   label:"Total Revenue (accrual)", unit:"$", note:"Xero Sales line, accrual. Cash basis $76,660. Mostly consulting." }
  },

  platforms: {
    linkedin: { name:"LinkedIn", metrics:[
      ["Organic impressions","3,192"],["Organic clicks","93"],
      ["Paid impressions","26,015"],["Paid clicks","334"],
      ["Best post CTR","6.6% (TAS)"]] },
    facebook: { name:"Facebook", metrics:[
      ["Reach","71"],["Views","1,391"],["Visits","86"],
      ["Link clicks","2"],["Follows","3"]] },
    instagram:{ name:"Instagram", metrics:[
      ["Views","134"],["Interactions","15"],["Visits","4"],
      ["Link clicks","0"],["Follows","0"]] },
    wix:      { name:"Wix / Website", metrics:[
      ["Top page","/shop/policy-packs"],["Shop orders","6"],
      ["Shop revenue","$572"],["Email-driven sessions","high"],
      ["Bounce (key pages)","84–100%"]] },
    google:   { name:"Google Organic", metrics:[
      ["GSC top query","'coast wide training'"],["Brand clicks","~10"],
      ["Non-brand visibility","low"],["Best non-brand","'rto internal audit template'"],
      ["GSC connected","NO — pending"]] }
  },

  campaigns: [
    ["May Newsletter (Compliance Compass)","Email","All contacts","22% open","1 order","$110","steady"],
    ["12 May Newsletter (re-send segment)","Email","1,391","8% open","0","$0","under"],
    ["This Week in PD (x3)","Email","~2,280 ea","21–23% open","0","$0","steady"],
    ["The Resource Drop (x4)","Email","~2,280 ea","22–24% open","0","$0","steady"],
    ["LinkedIn Sponsored — Website Visits","LinkedIn (paid)","26,015 impr","334 clicks","0 tracked","$0","under"],
    ["LinkedIn Organic (15 posts)","LinkedIn (organic)","3,192 impr","93 clicks","n/a","brand","work"],
    ["Google Ads — PMax (prohibited type)","Google (paid)","18,204 impr","1,630 clicks","1 conv","n/t","under"],
    ["Google Ads — EOFY Search / keywords","Google (paid)","0 impr","0 clicks","0","$0","under"],
    ["Facebook / Instagram organic","Meta","~1,525 views","2 clicks","0","$0","under"]
  ]
};

/* ---------- render ---------- */
function money(v){ return v==null?"—":"$"+Number(v).toLocaleString("en-AU",{maximumFractionDigits:0}); }
function statusFor(a,t){
  if(a==null||t==null) return ["nodata","No data / N/A"];
  const p=a/t;
  if(p>=0.85) return ["green","On track"];
  if(p>=0.5)  return ["amber","Monitor"];
  return ["red","Review (>15% below)"];
}
function kpiCard(k,showTarget){
  const [cls,txt]=statusFor(k.actual,k.target);
  let pace="";
  if(k.actual!=null&&k.target!=null){ pace=`${Math.round(k.actual/k.target*100)}% of monthly pace`; }
  let arrow="";
  if(k.prior!=null&&k.actual!=null){
    const up=k.actual>=k.prior;
    arrow=`<span class="arrow ${up?'up':'down'}">${up?'▲':'▼'} vs ${k.unit==='$'?money(k.prior):k.prior}</span>`;
  }
  const val=(k.unit==='$')?money(k.actual):(k.actual==null?"—":k.actual+(k.unit==='h'?" h":""));
  return `<div class="card ${cls}">
    <div class="label">${k.label}</div>
    <div class="val">${val}${arrow}</div>
    <div class="target">${showTarget&&k.target!=null?("Target "+(k.unit==='$'?money(k.target):k.target+(k.unit==='h'?" h":""))+"/mo"):"&nbsp;"}</div>
    ${pace?`<div class="pace">${pace}</div>`:""}
    <span class="status s-${cls}">${txt}</span>
    <div class="note">${k.note||""}</div>
  </div>`;
}
function platCard(p){
  return `<div class="card"><div class="label" style="color:var(--teal)">${p.name}</div>
    ${p.metrics.map(m=>`<div class="pm"><span>${m[0]}</span><b>${m[1]}</b></div>`).join("")}</div>`;
}
const tagMap={work:["t-work","Working"],steady:["t-steady","Steady"],under:["t-under","Underperforming"],brand:["t-steady","Brand (no $)"],nodata:["t-nodata","No data"]};
function campRow(c){
  const [cls,txt]=tagMap[c[6]]||tagMap.nodata;
  return `<tr><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td><td>${c[4]}</td><td>${c[5]}</td><td><span class="tag ${cls}">${txt}</span></td></tr>`;
}

document.write(`
<header>
  <h1>Coast Wide Training Solutions — Monthly Marketing Dashboard</h1>
  <div class="sub">Performance, attribution and recommendations across all active channels</div>
  <span class="badge">Reporting period: ${DATA.period}</span>
  <div class="gen">Generated ${DATA.generated} · All values ex GST unless noted</div>
</header>

<h2>Revenue KPIs vs FY2027 Targets</h2>
<div class="grid kpis">
  ${kpiCard(DATA.kpis.wixShop,true)}
  ${kpiCard(DATA.kpis.vetr,true)}
  ${kpiCard(DATA.kpis.courses,true)}
  ${kpiCard(DATA.kpis.consulting,false)}
</div>
<div class="grid kpis" style="margin-top:14px">
  ${kpiCard(DATA.kpis.linkedinSpend,false)}
  ${kpiCard(DATA.kpis.googleSpend,true)}
  ${kpiCard(DATA.kpis.marketingHrs,true)}
  ${kpiCard(DATA.kpis.totalRev,false)}
</div>
<div class="note">Monthly pace = FY2027 annual target ÷ 12. Wix $140k, Vetr $15k, Courses $80k. The &gt;15% below-target rule flags all three product/course streams as Review for May — expected in a deliberate pre-EOFY no-discount month, but recorded honestly.</div>

<h2>Platform Performance</h2>
<div class="grid plat">
  ${platCard(DATA.platforms.linkedin)}
  ${platCard(DATA.platforms.facebook)}
  ${platCard(DATA.platforms.instagram)}
  ${platCard(DATA.platforms.wix)}
  ${platCard(DATA.platforms.google)}
</div>

<h2>Campaign Breakdown</h2>
<table>
  <thead><tr><th>Campaign</th><th>Channel</th><th>Reach / Sent</th><th>Clicks / Opens</th><th>Conversions</th><th>Revenue</th><th>Result</th></tr></thead>
  <tbody>${DATA.campaigns.map(campRow).join("")}</tbody>
</table>
<div class="note">"n/t" = not tracked. LinkedIn paid shows 0 conversions because on-site conversion tracking is not confirmed firing — see action 2.</div>

<h2>MC Analysis &amp; Recommendations</h2>
<div class="analysis">
  <p><b>What happened.</b> May was a browse-not-buy month, which is consistent with strategy: no discounting ahead of EOFY, so demand was deliberately held back. Traffic and engagement were healthy. Email open rates sat at 21–26% across the main sends, LinkedIn organic produced strong compliance-led engagement (the TAS post hit a 6.6% click rate), and the shop's policy-packs page was comfortably the most-visited destination. The problem is the conversion end: across nine in-scope email sends, attributed orders totalled one, Wix shop revenue was $572 from six orders (one a $0 coupon), Vetr returned a single $171.50 pack, and course enrolments were three low-ticket aXcelerate sales totalling $202.68.</p>

  <p><b>What it means for trajectory.</b> All three product/course streams sit well below the monthly pace their FY2027 targets imply, tripping the Review threshold. In isolation that is alarming; in context it is the expected shape of a pre-EOFY month where buyers wait for the 1 June discount. The real test is June. The entire annual product story now leans heavily on EOFY converting the interest that May built. The audience is warm, the click behaviour is there, the purchase trigger was simply absent by design.</p>

  <div class="flag"><b>Live issue — Google Ads is breaching strategy and wasting spend.</b> The enabled campaign is a Performance Max campaign, which the strategy explicitly prohibits (phrase and exact match only, no Smart Campaigns/PMax, Australia-only). It consumed effectively the entire $299 Google budget on 1,630 mostly-mobile clicks for one conversion, while the correctly-built EOFY Search and phrase-match keyword campaigns sat starved at $0. This is fixable today and should be.</div>

  <div class="flag"><b>Live issue — newsletter list/segment.</b> The 12 May newsletter reached only 1,391 recipients at 8% open, against ~2,280 at 21%+ for every other send, with a duplicate-looking send the same day. If the June EOFY newsletter went out today on that same truncated segment, the sale announcement reached half the audience at a fraction of the open rate. Confirm before the day closes.</div>

  <p><b>Action list for June (max 5):</b></p>
  <ol>
    <li><b>Fix Google Ads today.</b> Pause the Performance Max campaign. Enable the EOFY Search and phrase/exact keyword campaigns, Australia-only geo, Mon–Fri 7am–7pm AEST. Redirect the full Google budget into high-intent EOFY search while the sale is live. Owner: Kai.</li>
    <li><b>Verify conversion tracking.</b> LinkedIn paid drove 334 clicks with zero tracked conversions and email clicks aren't attributing to orders. Confirm the LinkedIn Insight Tag and Wix purchase events are firing before EOFY spend ramps, or June's report repeats the same blind spot. Owner: Kai.</li>
    <li><b>Confirm the EOFY newsletter reached the full list.</b> Check today's 1 June send used the ~2,280 audience, not the 1,391 segment. Re-send to the full list if it was truncated. Build the day-5 reissue-to-unopened into all nine June sends. Owner: Jess.</li>
    <li><b>Add a Last Chance social countdown for the final week (24–30 June).</b> The plan leans on email for EOFY and keeps social light. Social costs nothing and the closing window converts hardest. Use the existing countdown templates, organic only on Meta given its near-zero attribution. Owner: Jess.</li>
    <li><b>Scale what's already working at zero cost.</b> LinkedIn organic is the standout channel. Keep Jodie's compliance-led posts running Mon/Wed/Fri through June, each linking to a shop or course page, and personalise the 26 June Meet the Team placeholder before scheduling. Owner: Jodie/Tracy to personalise, Jess to schedule.</li>
  </ol>

  <p class="note">This written analysis is a strategic brief and must be reviewed by a CWTS team member before the report is shared externally. Course enrolment figure reflects three aXcelerate invoices; Xero cash basis will reconcile timing. Marketing hours card is pending confirmation of the marketing-tagged total from the Teamwork report. Google Search Console remains unconnected (Section 13.7) — organic reporting is limited to the GSC query export until it is linked.</p>
</div>

<div class="footer">Coast Wide Training Solutions Pty Ltd · MC Monthly Marketing Dashboard · ${DATA.period} · Internal — review before external distribution</div>
`);
</script>
</div>
</body>
</html>
